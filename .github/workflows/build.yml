name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: RecentsShield
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish as the "latest" release (easy to download on your phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk RecentsShield.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest RecentsShield.apk \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}. On your phone, tap RecentsShield.apk below to download and install." \
            --target "$GITHUB_SHA"
